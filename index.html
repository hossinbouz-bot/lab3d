<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}body{margin:0;padding:0}img{max-width:100%}

/* Design tokens: Maccabi palette (navy #083F92, berry #B83B7C, online blue #296BED), Heebo, pill buttons, soft 24-32px cards */
:root{
  --bg:#F3F7FC;--surface:#FFFFFF;--surface-2:#EFF4FB;--ink:#1E2440;--muted:#56607A;--line:#DCE4F0;
  --head:#083F92;--logo:#0D47A1;
  --accent:#083F92;--accent-ink:#FFFFFF;--accent-soft:#E6EEFA;
  --blue:#296BED;--blue-ink:#FFFFFF;
  --cta:#B83B7C;--cta-hover:#9E2F69;--cta-ink:#FFFFFF;--highlight:#B83B7C;--berry-soft:#FBEAF2;
  --hero:#E8F1FC;--hero-2:#FBE9F1;
  --good:#1E7A46;--good-soft:#E5F4EB;--warn:#8A5A00;--warn-soft:#FBF1DC;--crit:#B3261E;--crit-soft:#FBE7E5;
  --layer:rgba(8,63,146,.05);
  --shadow:0 1px 2px rgba(16,37,84,.05),0 6px 20px rgba(16,37,84,.07);
  --shadow-lg:0 22px 44px -18px rgba(8,40,100,.38);
  --scrim:rgba(6,24,60,.86);
  --f-body:"Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-head:"Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r-sm:12px;--r-md:18px;--r-lg:24px;--r-xl:32px;--tabbar-h:64px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1328;--surface:#121D3A;--surface-2:#172447;--ink:#E8EDF8;--muted:#A4B0CB;--line:#26355C;
  --head:#DCE6FA;--logo:#FFFFFF;
  --accent:#8FB3FF;--accent-ink:#0B1328;--accent-soft:#1B2B55;
  --blue:#2F67D8;--blue-ink:#FFFFFF;
  --cta:#B83B7C;--cta-hover:#C94A8C;--cta-ink:#FFFFFF;--highlight:#F28DC0;--berry-soft:#3A1830;
  --hero:#13224A;--hero-2:#2A1636;
  --good:#5CC48A;--good-soft:#15301F;--warn:#E3B04B;--warn-soft:#33280F;--crit:#F07C72;--crit-soft:#3A1714;
  --layer:rgba(143,179,255,.06);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
  --shadow-lg:0 22px 44px -18px rgba(0,0,0,.7);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0B1328;--surface:#121D3A;--surface-2:#172447;--ink:#E8EDF8;--muted:#A4B0CB;--line:#26355C;
  --head:#DCE6FA;--logo:#FFFFFF;
  --accent:#8FB3FF;--accent-ink:#0B1328;--accent-soft:#1B2B55;
  --blue:#2F67D8;--blue-ink:#FFFFFF;
  --cta:#B83B7C;--cta-hover:#C94A8C;--cta-ink:#FFFFFF;--highlight:#F28DC0;--berry-soft:#3A1830;
  --hero:#13224A;--hero-2:#2A1636;
  --good:#5CC48A;--good-soft:#15301F;--warn:#E3B04B;--warn-soft:#33280F;--crit:#F07C72;--crit-soft:#3A1714;
  --layer:rgba(143,179,255,.06);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
  --shadow-lg:0 22px 44px -18px rgba(0,0,0,.7);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
h1,h2,h3,h4{font-family:var(--f-head);font-weight:700;line-height:1.25;margin:0;text-wrap:balance;color:var(--head)}
h2{font-size:clamp(22px,5.2vw,28px)}h3{font-size:17px;font-weight:600}h4{font-size:15px;margin-top:10px}
p{margin:0}
.wrap{max-width:1120px;margin-inline:auto;padding-inline:16px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.nw{white-space:nowrap}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
@supports (backdrop-filter:blur(8px)){.top{background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:saturate(1.4) blur(12px)}}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);min-width:0}
.logo{display:block;width:74px;height:auto;flex:none;color:var(--logo)}
.brand-sep{width:1px;height:30px;background:var(--line);flex:none}
.brand-txt{display:grid;line-height:1.2;min-width:0}
.brand-txt b{font-size:16px;font-weight:700;color:var(--head);white-space:nowrap}
.brand-txt small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-tabs{display:none;gap:4px}
.top-tabs a{padding:8px 16px;border-radius:999px;color:var(--ink);text-decoration:none;font-weight:500;font-size:15px;transition:background-color .2s,color .2s}
.top-tabs a:hover{color:var(--accent);background:var(--accent-soft)}
.top-tabs a[aria-current="page"]{background:var(--accent);color:var(--accent-ink);font-weight:600}

/* phone tab bar */
.tabbar{position:fixed;inset-inline:0;bottom:0;z-index:30;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -6px 20px rgba(16,37,84,.06)}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:var(--tabbar-h);color:var(--muted);text-decoration:none;font-size:12px;font-weight:500}
.tabbar a[aria-current="page"]{color:var(--accent);font-weight:700}
.tabbar svg,.btn svg,.qa-ic svg,.thumb svg,.rail-nav svg,.lb-x svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tabbar svg{box-sizing:content-box;padding:4px 16px;border-radius:999px;transition:background-color .25s var(--ease)}
.tabbar a[aria-current="page"] svg{background:var(--accent-soft)}
.btn svg{width:18px;height:18px}
main{padding-block:16px calc(var(--tabbar-h) + 32px)}
#app.dirty main{padding-block-end:calc(var(--tabbar-h) + 120px)}
@media (min-width:760px){
  .top-tabs{display:flex}
  .tabbar{display:none}
  .logo{width:84px}
  main{padding-block:28px 64px}
  #app.dirty main{padding-block-end:130px}
}
@media (max-width:359px){.brand-txt small{display:none}}

/* buttons, chips, badges */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 22px;border-radius:999px;border:1px solid transparent;font:inherit;font-size:15px;font-weight:600;line-height:1.2;cursor:pointer;text-decoration:none;transition:background-color .2s,border-color .2s,color .2s,transform .2s var(--ease),box-shadow .2s}
.btn.primary{background:var(--cta);color:var(--cta-ink);box-shadow:0 6px 16px -8px rgba(184,59,124,.7)}
.btn.primary:hover{background:var(--cta-hover);transform:translateY(-1px)}
.btn.blue{background:var(--blue);color:var(--blue-ink)}
.btn.blue:hover{background:color-mix(in srgb,var(--blue) 86%,#000)}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--accent)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.sm{min-height:38px;padding:6px 14px;font-size:14px}
.btn.lg{min-height:52px;padding:12px 28px;font-size:16px}
.btn.danger{color:var(--crit)}
.btn:disabled{opacity:.6;cursor:default;transform:none}
.btn:focus-visible,.chip:focus-visible,.qa:focus-visible,.gcard:focus-visible,.use:focus-visible,.thumb:focus-visible,a:focus-visible,summary:focus-visible,.linkbtn:focus-visible,.rail-nav button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--accent);font-weight:500;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:2px 6px;scrollbar-width:thin}
.chip{display:inline-flex;align-items:center;gap:6px;flex:none;min-height:38px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background-color .2s,border-color .2s,color .2s}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .cnt{font-family:var(--f-mono);font-size:12px;opacity:.8}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.g{background:var(--good)}.dot.y{background:var(--warn)}.dot.r{background:var(--crit)}
@media (min-width:760px){.chips{flex-wrap:wrap;overflow:visible}}
.risk{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.risk::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.risk.g{background:var(--good-soft);color:var(--good)}.risk.y{background:var(--warn-soft);color:var(--warn)}.risk.r{background:var(--crit-soft);color:var(--crit)}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.badge.st-received,.badge.st-review,.badge.st-design{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.badge.st-printing{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.badge.st-ready{background:var(--good-soft);color:var(--good);border-color:transparent}
.badge.st-delivered{color:var(--muted)}
.badge.st-hold{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.badge.st-rejected{background:var(--crit-soft);color:var(--crit);border-color:transparent}

/* home: hero */
.announce{margin-bottom:16px;padding:12px 16px;border-radius:var(--r-md);background:var(--berry-soft);border-inline-start:4px solid var(--cta)}
.hero{position:relative;display:grid;gap:22px;align-items:center;padding:26px 18px 22px;border-radius:var(--r-xl);overflow:hidden;
  background:radial-gradient(120% 90% at 0% 100%,var(--hero-2) 0,transparent 55%),radial-gradient(90% 80% at 100% 0%,color-mix(in srgb,var(--blue) 14%,transparent) 0,transparent 60%),var(--hero)}
.hero::before{content:"";position:absolute;inset:auto 0 0 0;height:46%;background:repeating-linear-gradient(0deg,var(--layer) 0 1px,transparent 1px 7px);-webkit-mask-image:linear-gradient(0deg,#000,transparent);mask-image:linear-gradient(0deg,#000,transparent);pointer-events:none}
@media (min-width:860px){.hero{grid-template-columns:1.1fr 1fr;padding:48px 52px;gap:36px}}
.hero-txt{position:relative;display:grid;gap:14px;min-width:0;justify-items:start}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--cta);background:var(--surface);padding:5px 14px;border-radius:999px;box-shadow:var(--shadow)}
.eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--cta);animation:pulse 2.4s ease-in-out infinite}
.hero h1{font-size:clamp(30px,7.4vw,48px);line-height:1.12;font-weight:800;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--cta)}
.lead{font-size:17px;color:var(--muted);max-width:52ch}
.hero .actions{margin-top:4px}
.hero-txt>*{animation:rise .7s var(--ease) both}
.hero-txt>:nth-child(2){animation-delay:.08s}.hero-txt>:nth-child(3){animation-delay:.16s}.hero-txt>:nth-child(4){animation-delay:.24s}
.hm{position:relative;width:100%;max-width:470px;aspect-ratio:10/9;justify-self:center;margin:0}
.hm-main{position:absolute;inset:7% 3% 15% 12%;border-radius:var(--r-lg);overflow:hidden;background:var(--surface);box-shadow:var(--shadow-lg)}
.hm-main img{display:block;width:100%;height:100%;object-fit:cover;animation:print 2.6s steps(26,end) .35s both}
.hm-scan{position:absolute;inset-inline:0;bottom:0;height:3px;background:linear-gradient(90deg,transparent,var(--cta) 20%,#fff 50%,var(--cta) 80%,transparent);box-shadow:0 0 14px 2px color-mix(in srgb,var(--cta) 70%,transparent);animation:scan 2.6s steps(26,end) .35s both;pointer-events:none}
.hm-card{position:absolute;width:44%;aspect-ratio:4/3;border-radius:18px;overflow:hidden;border:4px solid var(--surface);background:var(--surface);box-shadow:var(--shadow-lg)}
.hm-card img{display:block;width:100%;height:100%;object-fit:cover}
.hm-a{left:0;bottom:2%;rotate:-5deg;animation:pop .7s var(--ease) 1.4s both,float 7s ease-in-out 2.2s infinite}
.hm-b{right:0;top:0;width:38%;rotate:6deg;animation:pop .7s var(--ease) 1.7s both,float 8s ease-in-out 2.6s infinite reverse}
.hm-tag{position:absolute;right:4%;bottom:3%;display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:var(--surface);color:var(--muted);font-size:12px;font-weight:500;box-shadow:var(--shadow);animation:pop .6s var(--ease) 2s both}
.hm-tag b{color:var(--accent);font-weight:600}
@keyframes print{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes scan{0%{bottom:0;opacity:1}92%{opacity:1}100%{bottom:100%;opacity:0}}
@keyframes rise{from{opacity:0;translate:0 16px}to{opacity:1;translate:0 0}}
@keyframes pop{from{opacity:0;scale:.86}to{opacity:1;scale:1}}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -9px}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* quick actions (Maccabi-style shortcut tiles) */
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:16px}
.qa{display:grid;justify-items:center;align-content:start;gap:8px;padding:14px 4px 12px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:13px;font-weight:500;line-height:1.3;text-align:center;text-decoration:none;cursor:pointer;transition:transform .25s var(--ease),box-shadow .25s,border-color .25s}
.qa:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.qa-ic{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);transition:transform .35s var(--ease)}
.qa:hover .qa-ic{transform:rotate(-8deg) scale(1.06)}
.qa-ic svg{width:22px;height:22px}
@media (min-width:760px){.quick{gap:12px;margin-top:20px}.qa{grid-auto-flow:column;justify-content:center;align-items:center;gap:12px;padding:16px;font-size:15px}}

/* sections */
.block{display:grid;gap:16px;margin-top:44px}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:12px}
.sec-head>div:first-child{display:grid;gap:6px;min-width:0}
.kicker{font-size:13px;font-weight:600;color:var(--cta)}
.sub{color:var(--muted);max-width:65ch}
.block,.adlist,.qlist,.form,fieldset,.out,.ad-body,.filters,.page-head,.mine,.qcard,.hero-txt,.split>section{grid-template-columns:minmax(0,1fr)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));counter-reset:s}
.steps li{position:relative;display:grid;gap:6px;align-content:start;padding:18px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line)}
.step-n{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:13px}
.steps p{color:var(--muted);font-size:15px}
@media (max-width:759px){.steps li{grid-template-columns:34px 1fr;column-gap:12px;padding:14px 16px}.steps li .step-n{grid-row:span 2}.steps li h3,.steps li p{grid-column:2}}
@media (max-width:519px){.hero .actions .btn{flex:1 1 100%}}

/* use-in-practice bento */
.uses{display:grid;gap:12px}
@media (min-width:760px){.uses{grid-template-columns:1.35fr 1fr;grid-template-rows:1fr 1fr}.uses .use:first-child{grid-row:span 2}}
.use{position:relative;display:block;min-height:230px;padding:0;border:0;border-radius:var(--r-lg);overflow:hidden;background:var(--surface-2);cursor:zoom-in;font:inherit;text-align:start;color:#fff;isolation:isolate}
.use img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:scale .8s var(--ease)}
.use:hover img{scale:1.05}
.use .cap{position:absolute;inset:auto 0 0 0;z-index:1;display:grid;gap:4px;padding:56px 18px 16px;background:linear-gradient(0deg,var(--scrim) 0,rgba(6,24,60,.55) 55%,transparent)}
.cap b{font-size:18px;font-weight:700;line-height:1.3}
.cap-x{font-size:14px;opacity:.92;max-width:48ch}
.cap small{font-size:11px;opacity:.75}
.use-tag{position:absolute;top:12px;inset-inline-start:12px;z-index:1;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.92);color:#083F92;font-size:12px;font-weight:600}
@media (min-width:760px){.use{min-height:250px}.uses .use:first-child{min-height:520px}}

/* gallery rail */
.rail-nav{display:none;gap:8px}
.rail-nav button{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);cursor:pointer;transition:background-color .2s,color .2s}
.rail-nav button:hover{background:var(--accent);color:var(--accent-ink)}
@media (min-width:760px){.rail-nav{display:flex}}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:min(76%,270px);gap:12px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scroll-padding-inline:16px;padding:4px 16px 14px;margin-inline:-16px;scrollbar-width:thin}
.gcard{scroll-snap-align:start;display:flex;flex-direction:column;padding:0;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--surface);color:var(--ink);font:inherit;text-align:start;cursor:zoom-in;transition:transform .3s var(--ease),box-shadow .3s}
.gcard:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.gm{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--surface-2)}
.gm img{display:block;width:100%;height:100%;object-fit:cover;transition:scale .7s var(--ease)}
.gcard:hover .gm img{scale:1.06}

function normalize(s){
  s=s&&typeof s==='object'?s:{};

function go(tab,opt){
  if(!TAB_IDS.includes(tab))tab='home';

  ({home:renderHome,catalog:renderCatalog,request:renderRequest,queue:renderQueue,admin:renderAdmin})[tab]();

let io=null,reduceMotion=false;
function setupReveal(){
  try{reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
  if(reduceMotion||!('IntersectionObserver' in window))return;
  document.documentElement.classList.add('js-rv');
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{rootMargin:'0px 0px -6% 0px',threshold:.12});
}
function reveal(root){if(io)$$('.rv:not(.in)',root).forEach(el=>io.observe(el));}
function openMedia(id){

<div class="actions">${m.cat?'<button type="button" class="btn primary" data-act="ask" data-id="'+m.cat+'">בקשת פריט דומה</button>':'<button type="button" class="btn primary" data-act="new-request">בקשת פריט דומה</button>'}<button type="button" class="btn ghost" data-act="lb-close">סגירה</button></div></div>`;
  try{lb.showModal();}catch(e){lb.setAttribute('open','');}
}
function closeMedia(){const lb=$('#lb');if(lb&&lb.open){try{lb.close();}catch(e){lb.removeAttribute('open');}}}
function scrollRail(dir){
  const r=$('#rail'),c=r&&$('.gcard',r);if(!c)return;
  const step=(c.offsetWidth+12)*dir,rtl=getComputedStyle(r).direction==='rtl';
  r.scrollBy({left:rtl?-step:step,behavior:reduceMotion?'auto':'smooth'});
}

const fld=n=>$('#req').elements.namedItem(n);

function calcRisk(d){
  let risk=null;

  if(d.type==='catalog'&&d.item){const it=itemById(d.item);if(it&&(!risk||RANK[it.r]>RANK[risk]))risk=it.r;}
  return risk;
}
const LONGNUM=/(^|\D)\d{7,}(\D|$)|0\d{1,2}-\d{7}/;
function validate(d){

  if(!d.name)e.name='כתבו שם, כדי שנדע למי לחזור.';
  if(d.type==='catalog'&&!d.item)e.item='בחרו פריט מהקטלוג.';
  if(d.type!=='catalog'&&!d.title)e.title='תנו לפריט שם קצר.';
  if(d.type!=='catalog'&&d.problem.length<5)e.problem='תארו בקצרה את הבעיה או הצורך.';
  ['title','problem','site'].forEach(k=>{if(LONGNUM.test(d[k]||''))e[k==='site'?'problem':k]='נראה שיש כאן מספר ארוך (ת״ז, טלפון או מספר דגימה). מחקו אותו ונסו שוב.';});
  if(!d.touches.length)e.touch='סמנו לפחות אפשרות אחת.';

function notifyMail(d){
  if(!MAIL_HOOK)return;
  const payload={code:d.code,dept:deptName(d.dept),site:d.site,name:d.name,type:TYPE_L[d.type],item:d.itemTitle,problem:d.problem,dims:d.dims,qty:d.qty,due:fmtDate(d.due),touches:d.touchText,risk:RISK[d.risk].label,link:d.link,sentAt:fmtDateTime(new Date().toISOString()),page:location.origin+location.pathname};
  const sig=JSON.stringify(payload).replace(/"sentAt":"[^"]*",?/,'');
  let sent=ls.get('mailed',{});if(!sent||typeof sent!=='object')sent={};
  const prev=sent[d.code];
  if(prev&&prev.sig===sig)return;
  payload.rev=prev?(prev.rev||0)+1:0;
  sent[d.code]={sig,rev:payload.rev};
  const keys=Object.keys(sent);if(keys.length>40)keys.slice(0,keys.length-40).forEach(k=>delete sent[k]);
  ls.set('mailed',sent);
  try{fetch(MAIL_HOOK,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),keepalive:true}).catch(()=>{});}catch(e){}
}

}

async function publishNow(){
  if(!gh){toast('צריך לחבר את הדפדפן קודם (לשונית ניהול).');return;}
  const btn=$('#savebar [data-act="publish"]');if(btn){btn.disabled=true;btn.textContent='שומר…';}
  const next=JSON.parse(JSON.stringify(state));next.updatedAt=new Date().toISOString();
  ss.set('pending',next);
  try{
    const body={message:'Queue update '+next.updatedAt,content:b64enc(JSON.stringify(next,null,1)+'\n'),branch:gh.branch};
    if(baseSha)body.sha=baseSha;
    const r=await fetch(apiUrl(),{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},ghHeaders(gh.token)),body:JSON.stringify(body)});
    if(r.ok){
      const j=await r.json();baseSha=j.content&&j.content.sha||null;
      state=normalize(next);dirty=0;pendingStash=null;ss.del('pending');updateSavebar();invalidate();
      delete $('#v-admin').dataset.done;go(current,{keepScroll:true});
      toast('נשמר. האתר מתעדכן לכולם תוך כדקה.');return;
    }
    if(r.status===409||r.status===422){
      pendingStash=next;await loadFromApi();dirty=0;updateSavebar();delete $('#v-admin').dataset.done;go(current,{keepScroll:true});
      toast('התור עודכן ממקום אחר. נטענה הגרסה העדכנית, ואפשר לשחזר את השינויים בלשונית הניהול.');return;
    }
    if(r.status===401){toast('המפתח לא תקין או שפג תוקפו. צריך לחבר מחדש.');return;}
    if(r.status===403||r.status===404){toast('למפתח אין הרשאת כתיבה למאגר (Contents: Read and write).');return;}
    toast('השמירה לא הצליחה ('+r.status+'). נסו שוב בעוד רגע.');
  }catch(e){toast('אין חיבור ל-GitHub. השינויים נשארו בטלפון; נסו שוב.');}
  finally{const b=$('#savebar [data-act="publish"]');if(b){b.disabled=false;b.textContent='שמירה ופרסום';}}
}

  const rows=sortReqs(state.requests).map(r=>[r.code,deptName(r.dept),r.site,TYPE_L[r.type],r.title,r.qty,r.risk?RISK[r.risk].label:'',STATUS[r.status].name,fmtDate(r.createdAt),fmtDate(r.eta),fmtDate(r.readyAt),fmtDate(r.deliveredAt),
    r.deliveredAt?daysBetween(r.createdAt,r.deliveredAt):'',r.hours==null?'':r.hours,r.grams==null?'':r.grams,r.grams==null?'':(r.grams/1000*P).toFixed(2),r.alt==null?'':r.alt,r.rating==null?'':r.rating,r.touches,r.dims,r.note]);
  const cell=v=>{v=v==null?'':String(v);if(/^[=+\-@]/.test(v))v="'"+v;return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const csv='\uFEFF'+[head].concat(rows).map(r=>r.map(cell).join(',')).join('\r\n');
  try{
    const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
    const a=document.createElement('a');a.href=url;a.download='print-queue-'+todayISO()+'.csv';document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1500);
  }catch(e){toast('ההורדה לא הצליחה בדפדפן הזה.');}
}

/* ---------- events ---------- */
function onClick(e){
  const t=e.target.closest('[data-act],[data-dept],[data-risk],[data-group],[data-tab]');if(!t)return;
  if(t.dataset.tab){if(location.hash.slice(1)===t.dataset.tab){e.preventDefault();go(t.dataset.tab);}return;}
  if(t.dataset.dept!=null){catFilter.dept=t.dataset.dept;drawCatalog();return;}
  if(t.dataset.risk!=null){catFilter.risk=t.dataset.risk;drawCatalog();return;}
  if(t.dataset.group!=null){qFilter.group=t.dataset.group;drawQueue();return;}
  const row=t.closest('.adrow'),code=row&&row.dataset.code;
  if(t.closest('#lb')&&t.dataset.act!=='media')closeMedia();
  switch(t.dataset.act){
    case 'media':openMedia(t.dataset.m);break;
    case 'lb-close':break;
    case 'rail':scrollRail(+t.dataset.dir||1);break;
    case 'goto':{const s=document.getElementById(t.dataset.target);if(s)s.scrollIntoView({behavior:reduceMotion?'auto':'smooth',block:'start'});break;}
    case 'cat-dept':catFilter.dept=t.dataset.d||'all';catFilter.risk='all';catFilter.q='';delete $('#v-catalog').dataset.done;nav('catalog');break;
    case 'ask':askItem(t.dataset.id);break;
    case 'new-request':renderRequest();$('#req-out').hidden=true;$('#req').hidden=false;$('#req input[name="type"][value="new"]').checked=true;updateReqUI();saveDraft();nav('request');setTimeout(()=>{const f=fld('title');if(f)f.focus({preventScroll:true});},60);break;
    case 'reset-form':resetForm(false);break;
    case 'edit-again':$('#req-out').hidden=true;$('#req').hidden=false;break;
    case 'new-again':resetForm(true);$('#req-out').hidden=true;$('#req').hidden=false;window.scrollTo(0,0);break;
    case 'wa':rememberMine();break;
    case 'copy':copyMsg();break;
    case 'find':qFilter.q=t.dataset.code;$('#q-q').value=qFilter.q;drawQueue();break;
    case 'rm-mine':{const m=ls.get('mine',[]);ls.set('mine',(Array.isArray(m)?m:[]).filter(x=>x&&x.code!==t.dataset.code));drawQueue();break;}
    case 'parse':{const p=parseMessage($('#ad-paste').value);if(!Object.keys(p).length){$('#ad-msg').textContent='לא זוהו שדות בהודעה. אפשר למלא את הטופס ידנית.';break;}fillAddForm(p);$('#ad-msg').textContent='הטופס מולא מההודעה. בדקו ולחצו "הוספה לתור". השם לא נשמר.';break;}
    case 'add':addFromForm();break;
    case 'up':moveReq(code,-1);break;
    case 'down':moveReq(code,1);break;
    case 'to-cat':{const r=state.requests.find(x=>x.code===code);if(!r)break;if(state.catalogExtra.some(x=>x.src===r.code)){toast('הפריט כבר בקטלוג.');break;}
      state.catalogExtra.push(normExtra({id:'x'+Date.now().toString(36),src:r.code,d:r.dept,t:r.title,x:'הודפס כבר במעבדה עבור '+deptName(r.dept)+'. אפשר להזמין שוב או לבקש התאמה.',r:r.risk||'g',m:'PETG',s:'ready',n:r.dims?'מידות: '+r.dims:''}));
      touchState();drawExtras();toast('נוסף לקטלוג. יופיע לכולם אחרי פרסום.');break;}
    case 'rm-extra':state.catalogExtra=state.catalogExtra.filter(x=>x.id!==t.dataset.id);touchState();drawExtras();break;
    case 'del':t.parentElement.innerHTML='<span class="muted">למחוק את הבקשה?</span><button class="btn ghost sm danger" type="button" data-act="del-yes">כן, למחוק</button><button class="btn ghost sm" type="button" data-act="del-no">ביטול</button>';break;
    case 'del-yes':state.requests=state.requests.filter(r=>r.code!==code);openRows.delete(code);touchState();drawAdminList();drawKPI();break;
    case 'del-no':drawAdminList();break;
    case 'csv':exportCSV();break;
    case 'publish':publishNow(false);break;
    case 'discard':$('#savebar-act').innerHTML='<span>לבטל את כל השינויים?</span><button class="btn ghost sm danger" type="button" data-act="discard-yes">כן, לבטל</button><button class="btn ghost sm" type="button" data-act="discard-no">לא</button>';break;
    case 'discard-no':savebarButtons();break;
    case 'discard-yes':state=loadState();dirty=0;openRows.clear();savebarButtons();updateSavebar();invalidate();delete $('#v-admin').dataset.done;go(current,{keepScroll:true});toast('השינויים בוטלו.');break;
    case 'restore':if(pendingStash){state=normalize(pendingStash);pendingStash=null;ss.del('pending');dirty=1;updateSavebar();invalidate();delete $('#v-admin').dataset.done;renderAdmin();toast('השינויים שוחזרו. לחצו "שמירה ופרסום".');}break;
    case 'drop-pending':pendingStash=null;ss.del('pending');renderAdmin();break;
    case 'gh-disconnect':ls.del('gh');gh=null;baseSha=null;canAdmin=false;dirty=0;pendingStash=null;updateSavebar();redrawNav();delete $('#v-admin').dataset.done;nav('home');toast('הדפדפן נותק מעדכון התור.');break;
  }
}
function onChange(e){
  const el=e.target;
  if(el.id==='q-dept'){qFilter.dept=el.value;drawQueue();return;}
  if(el.closest('#req')){updateReqUI();saveDraftSoon();return;}
  const row=el.closest('.adrow');if(row&&el.dataset.f){editReq(row.dataset.code,el.dataset.f,el.value);return;}
  if(el.dataset.s){editSetting(el.dataset.s,el);}
}
function onInput(e){
  const el=e.target;
  if(el.id==='cat-q'){catFilter.q=el.value.trim();drawCatalog();return;}
  if(el.id==='q-q'){qFilter.q=el.value.trim();drawQueue();return;}
  if(el.closest('#req')){if(el.name==='touch'||el.name==='type'||el.name==='item')updateReqUI();clearErr(el.name);saveDraftSoon();}
}
function onSubmit(e){e.preventDefault();if(e.target.id==='req')submitRequest();else if(e.target.id==='gh-form')connectGitHub(e.target);}

/* ---------- data source: queue.json + GitHub API ---------- */
const ghHeaders=t=>({Authorization:'Bearer '+t,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'});
const apiUrl=()=>'https://api.github.com/repos/'+encodeURIComponent(gh.owner)+'/'+encodeURIComponent(gh.repo)+'/contents/'+QUEUE_FILE;
function b64enc(s){const b=new TextEncoder().encode(s);let bin='';for(let i=0;i<b.length;i+=0x8000)bin+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(bin);}
function b64dec(s){const bin=atob(String(s).replace(/\s/g,''));const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return new TextDecoder().decode(b);}
function detectRepo(){
  const h=location.hostname,parts=location.pathname.split('/').filter(Boolean);
  if(/\.github\.io$/i.test(h)){const owner=h.split('.')[0];return{owner,repo:parts[0]&&!/\.html?$/i.test(parts[0])?parts[0]:owner+'.github.io'};}
  return{owner:'',repo:''};
}
function rerender(){invalidate();if(current==='request')renderRequest();else if(current==='admin'){if(canAdmin&&!dirty){delete $('#v-admin').dataset.done;renderAdmin();}}else go(current,{keepScroll:true});}
async function loadRemote(){
  try{
    const r=await fetch(QUEUE_FILE+'?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('status '+r.status);
    const s=await r.json();
    if(!dirty)state=normalize(s);
    remoteStatus='ok';
  }catch(e){remoteStatus='failed';}
  lastLoad=Date.now();rerender();
}
async function loadFromApi(){
  const r=await fetch(apiUrl()+'?ref='+encodeURIComponent(gh.branch)+'&t='+Date.now(),{headers:ghHeaders(gh.token),cache:'no-store'});
  if(r.status===404){baseSha=null;remoteStatus='ok';lastLoad=Date.now();return;}
  if(!r.ok)throw Object.assign(new Error('api'),{status:r.status});
  const j=await r.json();baseSha=j.sha;
  state=normalize(JSON.parse(b64dec(j.content)));remoteStatus='ok';lastLoad=Date.now();invalidate();
}
function renderConnect(){
  const el=$('#v-admin'),det=gh||detectRepo();
  el.innerHTML=`<div class="page-head"><h2>כניסת מנהל</h2><p class="sub">חיבור הדפדפן הזה לעדכון התור. המפתח נשמר רק בדפדפן הזה ונשלח רק ל-GitHub.</p></div>
<form id="gh-form" class="form" novalidate>
  <div class="row2">
    <label class="field"><span>משתמש GitHub</span><input name="owner" dir="ltr" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(det.owner||'')}"></label>
    <label class="field"><span>שם המאגר</span><input name="repo" dir="ltr" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(det.repo||'')}"></label>
  </div>
  <label class="field"><span>מפתח גישה (Fine-grained token)</span><input name="token" type="password" dir="ltr" autocomplete="off" placeholder="github_pat_…"><small class="hint">מספיקה הרשאה אחת: Contents – Read and write, למאגר הזה בלבד.</small></label>
  <div class="actions"><button class="btn primary" type="submit">חיבור</button><span class="hint" id="gh-msg" aria-live="polite"></span></div>
</form>`;
}
async function connectGitHub(f){
  const v=n=>String(f.elements.namedItem(n).value||'').trim(),msg=m=>{$('#gh-msg').textContent=m;};
  const owner=v('owner'),repo=v('repo'),token=v('token');
  if(!owner||!repo||!token){msg('צריך למלא משתמש, מאגר ומפתח.');return;}
  msg('בודק…');
  try{
    const r=await fetch('https://api.github.com/repos/'+encodeURIComponent(owner)+'/'+encodeURIComponent(repo),{headers:ghHeaders(token)});
    if(r.status===401){msg('המפתח לא תקין או שפג תוקפו.');return;}
    if(r.status===403||r.status===404){msg('המאגר לא נמצא, או שלמפתח אין גישה אליו.');return;}
    if(!r.ok){msg('GitHub החזיר שגיאה ('+r.status+').');return;}
    const j=await r.json();
    gh={owner,repo,token,branch:j.default_branch||'main'};
    await loadFromApi();
    ls.set('gh',gh);canAdmin=true;redrawNav();delete $('#v-admin').dataset.done;go('admin');
    toast('הדפדפן מחובר לעדכון התור.');
  }catch(e){gh=null;msg(e&&e.status?'לא הצלחתי לקרוא את התור ('+e.status+'). בדקו את הרשאות המפתח.':'אין חיבור ל-GitHub. בדקו את הרשת ונסו שוב.');}
}
async function start(){
  const saved=ls.get('gh',null);
  if(saved&&saved.token&&saved.owner&&saved.repo){
    gh={owner:String(saved.owner),repo:String(saved.repo),token:String(saved.token),branch:String(saved.branch||'main')};
    try{
      await loadFromApi();canAdmin=true;
      const p=ss.get('pending',null);
      if(p&&typeof p==='object'&&p.updatedAt!==state.updatedAt)pendingStash=p;
      redrawNav();rerender();
      if(current==='admin'){delete $('#v-admin').dataset.done;go('admin',{keepScroll:true});}
      return;
    }catch(e){gh=null;canAdmin=false;toast('החיבור ל-GitHub נכשל. התור מוצג בלי אפשרות עריכה.');}
  }
  await loadRemote();
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!dirty&&Date.now()-lastLoad>60000){if(canAdmin)loadFromApi().then(rerender,()=>{});else loadRemote();}});

/* ---------- start ---------- */
function init(){
  state=loadState();
  setupReveal();
  $('#app').innerHTML=shellHTML();
  $('#lb').addEventListener('click',e=>{if(e.target===e.currentTarget)closeMedia();});
  try{document.documentElement.lang='he';document.documentElement.dir='rtl';}catch(err){}
  const app=$('#app');
  app.addEventListener('click',onClick);app.addEventListener('change',onChange);app.addEventListener('input',onInput);app.addEventListener('submit',onSubmit);
  window.addEventListener('hashchange',()=>{const t=location.hash.slice(1);if(TAB_IDS.includes(t))go(t);});
  const h=location.hash.slice(1),saved=ss.get('tab','');
  wantAdmin=h==='admin'||saved==='admin';
  go(TAB_IDS.includes(h)?h:(TAB_IDS.includes(saved)&&saved!=='admin'?saved:'home'),{keepScroll:true});
  start();
}
init();
})();
</script>
